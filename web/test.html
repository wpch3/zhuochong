<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>小寻 · 动态立绘测试台</title>
<style>
:root{
  --bg:#F3F6F8; --card:#fff; --tx:#2C3A47; --mut:#7A8794;
  --acc:#7EC8C4; --acc2:#9FE3DD; --warn:#F7B7C8; --ok:#3FA796; --bad:#D6555A;
  --r:14px;
}
*{box-sizing:border-box}
body{margin:0;font:14px/1.6 "Segoe UI","Microsoft YaHei",system-ui,sans-serif;
     background:var(--bg);color:var(--tx)}
header{display:flex;align-items:baseline;gap:12px;padding:12px 18px;background:#fff;
       box-shadow:0 2px 10px rgba(120,140,160,.12);position:sticky;top:0;z-index:9}
header h1{font-size:17px;margin:0}
header small{color:var(--mut)}
.wrap{display:flex;gap:14px;align-items:flex-start;padding:14px;flex-wrap:wrap}
.col{display:flex;flex-direction:column;gap:14px;flex:1 1 340px;min-width:320px}
.col.stagecol{flex:0 0 380px}
.card{background:var(--card);border-radius:var(--r);padding:12px 14px;
      box-shadow:0 8px 22px rgba(120,140,160,.14)}
.card h2{font-size:14px;margin:0 0 8px;color:#5B6B7C;letter-spacing:.5px}
.stage{background:linear-gradient(180deg,#EAF7F6,#F7FAFB);border-radius:var(--r);
       display:flex;align-items:center;justify-content:center;padding:6px;cursor:pointer;
       position:relative;overflow:hidden}
.stage img{display:block;max-height:52vh;image-rendering:auto;user-select:none;-webkit-user-drag:none}
.stage .hit{position:absolute;inset:0}
button{font:inherit;border:none;border-radius:999px;padding:6px 12px;margin:3px 5px 3px 0;
       background:linear-gradient(180deg,#fff,#EAF7F6);color:var(--tx);cursor:pointer;
       box-shadow:0 3px 8px rgba(120,140,160,.18);transition:transform .1s}
button:hover{transform:translateY(-1px)}
button:active{transform:translateY(1px)}
button.pri{background:linear-gradient(180deg,var(--acc2),var(--acc));color:#fff;font-weight:600}
button.warn{background:linear-gradient(180deg,#FFD9E4,var(--warn));font-weight:600}
button.sm{padding:4px 9px;font-size:12px}
.pill{display:inline-block;background:#EAF7F6;border-radius:999px;padding:2px 10px;
      margin:2px 5px 2px 0;font-size:12px}
.pill.on{background:#D6F5F1;font-weight:600}
label.row{display:flex;align-items:center;gap:8px;margin:6px 0;font-size:13px}
label.row span:first-child{width:62px;color:var(--mut)}
input[type=range]{flex:1;accent-color:var(--acc)}
code{background:#F0F4F6;border-radius:5px;padding:1px 5px;font-size:12px}
table{border-collapse:collapse;width:100%;font-size:12px}
th,td{text-align:left;padding:3px 6px;border-bottom:1px solid #EEF2F4;white-space:nowrap}
th{color:var(--mut);font-weight:600;position:sticky;top:0;background:#fff}
.scroll{max-height:300px;overflow:auto}
.log{font-family:ui-monospace,Consolas,monospace;font-size:12px;max-height:240px;overflow:auto;
     background:#263238;color:#CFE8E6;border-radius:10px;padding:8px 10px;white-space:pre-wrap}
.log .ok{color:#8BE3C8}
.log .bad{color:#FF9DA3}
.log .dim{color:#8CA3A8}
.res{display:flex;align-items:center;gap:8px;font-size:13px;padding:3px 0;border-bottom:1px solid #EEF2F4}
.res b{font-weight:600;min-width:46px}
.res .pass{color:var(--ok)} .res .fail{color:var(--bad)}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:4px 10px}
.tag{font-size:11px;background:#F0F4F6;border-radius:4px;padding:0 4px;margin-right:3px}
.muted{color:var(--mut)}
</style>
</head>
<body>
<header>
  <h1>小寻 · 动态立绘测试台</h1>
  <small id="hdr">连接中…</small>
  <span style="flex:1"></span>
  <button class="sm" onclick="location.href='/'">← 回预览页</button>
</header>

<div class="wrap">
  <!-- 左：画面 -->
  <div class="col stagecol">
    <div class="card">
      <h2>画面（点击＝摸头，移动＝视线跟随）</h2>
      <div class="stage" id="stage">
        <img id="pet" src="/api/frame.png" alt="小寻">
      </div>
      <div style="margin-top:8px">
        <span class="pill" id="p-act">动作 —</span>
        <span class="pill" id="p-blink">眨眼 —</span>
        <span class="pill" id="p-scale">缩放 —</span>
        <span class="pill" id="p-sleep">清醒</span>
        <span class="pill" id="p-fps">— fps</span>
        <span class="pill" id="p-region">鼠标下：—</span>
      </div>
      <div id="speech" style="margin-top:6px;min-height:1.5em"></div>
    </div>

    <div class="card">
      <h2>手动参数</h2>
      <label class="row"><span>眨眼</span>
        <input type="range" id="s-blink" min="0" max="1" step="0.01" value="0">
        <code id="v-blink">auto</code>
        <button class="sm" onclick="setBlink('auto')">自动</button></label>
      <label class="row"><span>视线 X</span>
        <input type="range" id="s-gx" min="-1" max="1" step="0.02" value="0">
        <code id="v-gx">0.00</code></label>
      <label class="row"><span>视线 Y</span>
        <input type="range" id="s-gy" min="-1" max="1" step="0.02" value="0">
        <code id="v-gy">0.00</code></label>
      <label class="row"><span>缩放</span>
        <input type="range" id="s-scale" min="0.4" max="1.6" step="0.05" value="1">
        <code id="v-scale">1.00</code></label>
      <button class="sm" onclick="resetParams()">全部复位</button>
    </div>
  </div>

  <!-- 中：互动 -->
  <div class="col">
    <div class="card">
      <h2>互动</h2>
      <div id="inter"></div>
    </div>
    <div class="card">
      <h2>动作（rig.json 里的全部动作）</h2>
      <div id="acts" class="muted">读取中…</div>
    </div>
    <div class="card">
      <h2>形态 / 服装</h2>
      <div id="forms" class="muted">读取中…</div>
    </div>
    <div class="card">
      <h2>自动测试</h2>
      <div>
        <button class="pri" id="btn-run" onclick="runSuite()">▶ 跑一遍（约 20 秒）</button>
        <button class="sm" onclick="document.getElementById('results').innerHTML=''">清空</button>
      </div>
      <div id="summary" style="margin:8px 0 4px"></div>
      <div id="results" class="scroll"></div>
    </div>
  </div>

  <!-- 右：零件表 + 日志 -->
  <div class="col">
    <div class="card">
      <h2>零件表 <span class="muted" id="partcount"></span></h2>
      <div class="scroll">
        <table id="parts"><thead><tr>
          <th>层</th><th>id</th><th>位置</th><th>标签</th><th>遮罩</th>
        </tr></thead><tbody></tbody></table>
      </div>
    </div>
    <div class="card">
      <h2>请求日志</h2>
      <div class="log" id="log"></div>
    </div>
  </div>
</div>

<script src="test.js"></script>
</body>
</html>
