      <path d="M 135 48 C 145 63 150 77 149 96 C 148 118 142 142 137 160 C 140 137 139 120 140 100 C 140 78 137 63 135 48 Z" fill="#ccb8cd" opacity=".48"/>
      <path d="M 121 172 C 127 180 137 186 150 187 C 147 191 139 193 126 190 Z" fill="#b6a4bb" opacity=".30"/>
