<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>遮挡底稿实验工作台</title><link rel="stylesheet" href="style.css"></head>
<body><header><div><h1>遮挡底稿实验工作台</h1><p>局部补画 · 源文件不覆盖 · 自研 zrig 试验</p></div><span class="badge">实验工具</span></header>
<main><section class="stage card"><div class="stage-head"><strong>素材预览</strong><span id="status" role="status">请载入三张 PNG</span></div><div class="canvas-wrap" id="canvasWrap"><canvas id="canvas" width="480" height="512" aria-label="底稿编辑画布"></canvas></div><p class="hint">只允许在中立位被不透明袖手盖住的像素上作画。旋转仅为浏览器近似预览，最终外观以 C 引擎帧为准。</p></section>
<aside><section class="card"><h2>1 · 载入素材</h2><button id="demo">载入动态 Chibi 示例</button><p class="hint">示例由隔离预览提供；本地文件只在浏览器读取。</p><label>身体 PNG<input type="file" id="bodyFile" accept="image/png"></label><label>左袖手 PNG<input type="file" id="leftFile" accept="image/png"></label><label>右袖手 PNG<input type="file" id="rightFile" accept="image/png"></label><button id="loadFiles">载入所选文件</button></section>
<section class="card"><h2>2 · 补画</h2><div class="row"><label>画笔颜色<input id="color" type="color" value="#f3edf1"></label><label>画笔大小 <output id="sizeOut">12</output><input id="size" type="range" min="1" max="80" value="12"></label></div><div class="buttons"><button id="brush" class="active">画笔</button><button id="picker">取色</button><button id="undo" disabled>撤销</button><button id="redo" disabled>重做</button><button id="clear" disabled>清空补画</button></div><p class="hint">取色来自未旋转素材。按笔、拖动、松开为一步；取消手势不会保存。导出透明补画层，不导出或覆盖原图。</p></section>
<section class="card"><h2>3 · 检查与导出</h2><label>左袖旋转 <output id="leftOut">0°</output><input id="leftAngle" type="range" min="-5" max="5" step="0.1" value="0"></label><label>右袖旋转 <output id="rightOut">0°</output><input id="rightAngle" type="range" min="-5" max="5" step="0.1" value="0"></label><div class="row"><label>背景<select id="background"><option value="light">浅色</option><option value="dark">深色</option><option value="checker">棋盘</option></select></label><label>缩放<select id="zoom"><option value="1">100%</option><option value="1.5">150%</option><option value="2">200%</option></select></label></div><label class="check"><input id="showArms" type="checkbox" checked>显示袖手</label><label class="check"><input id="showMask" type="checkbox">高亮可补画区域</label><button id="download" class="primary" disabled>下载透明补画 PNG</button><p class="hint">示例枢轴仅适用于当前 480×512 动态试装。超过 ±2° 是故障检查，不代表合格动作。</p></section></aside></main>
<script src="app.js"></script></body></html>
