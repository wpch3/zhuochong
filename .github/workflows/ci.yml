# 交付保险：每次 push / PR 都把"能在 Linux 上验证的"全跑一遍。
# 真机项目（透明窗、穿透、托盘、语音播放）CI 验不了，照旧靠 [需真机] 清单。
name: CI

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

jobs:
  build-test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - name: 装 Python 依赖（素材验收要 pillow/numpy）
        run: python3 -m pip install --quiet pillow numpy

      - name: 仓库静态自检（引用完整性/唯一性/契约/卫生）
        run: python3 tools/selfcheck_repo.py --root . --strict

      - name: 编译（核心代码零告警）
        shell: bash
        run: |
          # set -o pipefail：原来没有这行，编译**报错**会被 tee 吞掉（退出码变成 tee 的 0），
          # 只有 warning 才拦得住。顺便把失败内容用 ::error:: 打成注解 ——
          # 日志要下载才看得到，注解在网页和 `gh run view` 里直接能读。
          set -o pipefail
          make clean
          if ! make build/test_core 2>&1 | tee /tmp/build.log; then
            echo "::error::编译失败（下面是日志末尾）"
            tail -30 /tmp/build.log | while IFS= read -r l; do echo "::error::$l"; done
            exit 1
          fi
          if grep -q "warning:" /tmp/build.log; then
            echo "::error::编译有告警（CI 口径是零告警）"
            grep -B1 -A3 "warning:" /tmp/build.log | head -40 | while IFS= read -r l; do echo "::error::$l"; done
            exit 1
          fi
          echo "零告警通过：$(grep -c . /tmp/build.log) 行输出"

      - name: 单元测试
        run: make test

      - name: ASan + UBSan（越界/泄漏当场失败）
        run: make asan

      - name: TLS 闸门（证书验不过必须拒，而且一个字节都不许发）
        run: make tls

      - name: 素材机器验收
        run: python3 tools/check_assets.py --character xiaoxun --form teen

      - name: 端到端冒烟（起预览打一圈端点，判据是画面真的变了）
        run: make smoke

      - name: 出错时把日志捞出来
        if: failure()
        run: |
          tail -50 /tmp/build.log 2>/dev/null || true
          tail -50 logs/*.log 2>/dev/null || true
