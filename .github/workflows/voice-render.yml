name: voice-render

# 云端渲染语音（GitHub Actions）。用途：
#   - edge-tts（微软神经网络语音）：晓伊=少女、晓双=小女孩，即网上“AI 少女音”的主流做法
#   - 需要联网与密钥的供应商也可在这里加步骤（沙箱内出网受限，见 docs/HANDOFF_VOICE.md）
# 触发：手动 workflow_dispatch，或改动 voice 配置/台词/脚本时自动跑。
on:
  workflow_dispatch:
    inputs:
      character:
        description: "角色 id（characters/<id>/）"
        required: true
        default: xiaoxun
      only:
        description: "all | samples | lines"
        required: true
        default: all
      voice:
        description: "可选：覆盖少女音色（如 zh-CN-XiaoyiNeural）"
        required: false
        default: ""
  push:
    paths:
      - "characters/*/voice/plan.json"
      - "characters/*/voice/triggers/**"
      - "tools/voice_render.py"
      - ".github/workflows/voice-render.yml"

permissions:
  contents: read
  issues: write

jobs:
  render:
    runs-on: ubuntu-latest
    env:
      CHARACTER: ${{ inputs.character || 'xiaoxun' }}
      ONLY: ${{ inputs.only || 'all' }}
      VOICE: ${{ inputs.voice || '' }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: 安装 edge-tts
        run: python -m pip install --quiet edge-tts

      - name: 合成语音
        run: |
          set -uo pipefail
          ARGS=""
          [ -n "$VOICE" ] && ARGS="--voice $VOICE"
          if ! python tools/voice_render.py --character "$CHARACTER" --root . --only "$ONLY" $ARGS 2>&1 | tee /tmp/render.log; then
            echo "::error::合成失败，错误已回传到 Issue"
            jq -n --arg t "voice-render 失败 $(date -u +%FT%TZ)" \
                  --arg b "$(tail -c 3500 /tmp/render.log)" \
                  '{title:$t, body:$b}' > /tmp/payload.json
            curl -sS -X POST -H "Authorization: Bearer $GITHUB_TOKEN" \
                 -H "Accept: application/vnd.github+json" \
                 "https://api.github.com/repos/$GITHUB_REPOSITORY/issues" \
                 -d @/tmp/payload.json | head -c 200 || true
            exit 1
          fi

      - name: 校验产物（数量与非空）
        run: |
          set -e
          D="characters/$CHARACTER/voice"
          echo "--- 采样 ---"; ls -la "$D/samples" || true
          echo "--- 台词数 ---"; ls "$D/lines" | wc -l
          find "$D" -name '*.mp3' -size -2k -print | tee /tmp/bad.txt
          test ! -s /tmp/bad.txt

      - name: 打包
        run: |
          cd "characters/$CHARACTER/voice"
          zip -q -r "$GITHUB_WORKSPACE/voice_$CHARACTER.zip" samples lines catalog.json plan.json

      - uses: actions/upload-artifact@v4
        with:
          name: voice-${{ env.CHARACTER }}
          path: voice_${{ env.CHARACTER }}.zip
          retention-days: 30
